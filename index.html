<style>
  :root{
    color-scheme: dark;
    --bg:#0B0D10; --surface:#15191F; --surface-2:#1B2029; --border:#262C36;
    --ink:#EDEFF3; --ink-dim:#8D97A3; --accent:#FFFFFF; --accent-ink:#14181A;
    --good:#4FAE7A; --good-bg:#153323; --bad:#E2745E; --bad-bg:#3A1F1A;
    --na:#8D97A3; --na-bg:#1B2029;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 32px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; }
  .wrap{ position:relative; max-width:880px; margin:0 auto; padding:28px 20px 80px; }

  .head{ display:flex; align-items:center; gap:14px; margin-bottom:22px; }
  .head-icon{ width:44px; height:44px; border-radius:11px; flex:none; overflow:hidden;
    display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); }
  .head-icon img{ width:100%; height:100%; object-fit:cover; display:block; }
  .head h1{ margin:0; font-size:21px; font-weight:700; letter-spacing:-0.01em; }
  .head .sub{ margin-top:2px; font-size:11.5px; letter-spacing:0.09em; color:var(--ink-dim); text-transform:uppercase; }

  .brand-logo{ position:absolute; top:16px; right:20px; height:59px; width:auto; aspect-ratio:800/344;
    border-radius:8px; overflow:hidden; box-shadow:0 3px 14px rgba(0,0,0,.35); }
  .brand-logo svg{ display:block; height:100%; width:100%; }
  @media (max-width:640px){
    .wrap{ padding-top:70px; }
    .brand-logo{ top:14px; height:41px; }
  }

  .statusline{ min-height:18px; font-size:12.5px; margin:-10px 0 18px; display:flex; align-items:center; gap:6px; color:var(--ink-dim); }
  .statusline.saved{ color:var(--good); }
  .statusline.error{ color:var(--bad); }

  .banner{ background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad); border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:18px; display:none; }
  .banner.show{ display:block; }

  .controls{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px 14px; box-shadow:var(--shadow); margin-bottom:22px; }
  .control-row{ display:flex; flex-wrap:wrap; gap:22px; align-items:flex-end; }
  .field-label{ display:block; font-size:10.5px; font-weight:600; letter-spacing:0.09em; color:var(--ink-dim); text-transform:uppercase; margin-bottom:6px; }
  select.sel{ font-family:inherit; font-size:14.5px; color:var(--ink); background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    padding:8px 30px 8px 11px; appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238D97A3'/></svg>");
    background-repeat:no-repeat; background-position:right 11px center; cursor:pointer; min-width:0; }
  select.sel:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  #shiftSel{ min-width:88px; }

  .datefield{ position:relative; }
  .datebtn{ font-family:inherit; font-size:14.5px; font-weight:500; color:var(--ink); background:var(--surface-2);
    border:1px solid var(--border); border-radius:8px; padding:8px 32px 8px 11px; cursor:pointer; min-width:150px; text-align:left;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238D97A3' stroke-width='2'><rect x='3' y='5' width='18' height='16' rx='2'/><path d='M8 3v4M16 3v4M3 10h18'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center; }
  .datebtn:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  .calendar-pop{ margin-top:14px; padding-top:14px; border-top:1px solid var(--border); max-width:280px; }
  .calendar-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .calmonth{ font-size:13px; font-weight:600; }
  .calnav{ font-family:inherit; font-size:15px; line-height:1; color:var(--ink); background:var(--surface-2); border:1px solid var(--border);
    border-radius:7px; width:26px; height:26px; cursor:pointer; }
  .calnav:disabled{ opacity:0.35; cursor:not-allowed; }

    html += "      <button type=\"button\" class=\"calnav\" id=\"calPrev\""+(atRangeStartMonth?" disabled":"")+" aria-label=\"Previous month\">‹</button>";
    html += "      <span class=\"calmonth\">"+MONTHS[mo]+" "+y+"</span>";
    html += "      <button type=\"button\" class=\"calnav\" id=\"calNext\" aria-label=\"Next month\">›</button>";
    html += "    </div>";
    html += "    <div class=\"calendar-dow\">"+["S","M","T","W","T","F","S"].map(function(d2){ return "<span>"+d2+"</span>"; }).join("")+"</div>";
    html += "    <div class=\"calendar-grid\">";
    for (var i=0;i<startWeekday;i++){ html += "<span class=\"calcell empty\"></span>"; }
    for (var day=1; day<=daysInMonth; day++){
      var cellDate = new Date(y, mo, day);
      var iso = isoDate(cellDate);
      var disabled = cellDate < RANGE_START;
      var isSel = sameDay(cellDate, view.date);
      var isToday = sameDay(cellDate, today);
      var cls = "calcell calday" + (isSel?" selected":"") + (isToday && !isSel?" today":"");
      html += "<button type=\"button\" class=\""+cls+"\" data-date=\""+iso+"\""+(disabled?" disabled":"")+">"+day+"</button>";
    }
    html += "    </div>";
    html += "  </div>";
    return html;
  }
  // prefillAuditor carries the previous auditor's name forward into a fresh
  // draft right after a save, so the same person logging several audits in a
  // row doesn't have to retype their name each time.
  function newDraft(type, prefillAuditor){
    var t = TYPES[type];
    var fields = {}; t.fields.forEach(function(f){ fields[f.key] = ""; });
    // Each answer snapshots the topic's id/text/good at the moment the draft
    // is created, so a saved audit stays correctly labelled even if the
    // checklist is edited afterwards.
    var answers = topicsFor(type).map(function(tp){ return { qid:tp.id, text:tp.text, good:tp.good, result:"", comment:"", productId:"", photos: [] }; });
    return { auditor: prefillAuditor || "", fields: fields, answers: answers };
  }
  function ensureDraft(type){ if (!draft[type]) draft[type] = newDraft(type); }

  // A failing answer (anything other than the question's "good" value or
  // "N/A") must be explained with a comment before the audit can be saved.
  function isBadAnswer(type, idx, result){
    var q = topicsFor(type)[idx];
    return !!q && !!result && result !== q.good && result !== "N/A";
  }
  // A handful of questions (currently just Picking's "Correct quantity
  // picked?") need a Product ID captured when the answer fails, so whoever
  // reviews the audit knows which product needs the extra box.
  function productIdMissing(type, idx){
    var q = topicsFor(type)[idx];
    if (!q || !q.requiresProductIdOnFail) return false;
    var a = draft[type] && draft[type].answers[idx];
    if (!a) return false;
    return isBadAnswer(type, idx, a.result) && !(a.productId && a.productId.trim());
  }
  function badLabel(q){
    return q.options.filter(function(o){ return o !== q.good && o !== "N/A"; }).join(" or ");
  }
  function commentMissing(type, idx){
    var a = draft[type].answers[idx];
    return isBadAnswer(type, idx, a.result) && !(a.comment && a.comment.trim());
  }
  // Whether a question offers photo evidence at all, and whether the
  // "add photo" control should only appear once the answer is failing —
  // Packing's "Correct label placement..." question and Picking's "Overall
  // state of the pick..." question both only want a photo once something's
  // actually wrong. The id check is a safety net: these questions' wording
  // may have been customised via "Edit checklist" in the live board, and a
  // topic loaded from Supabase won't carry a field this app didn't know
  // about when it was saved, so the id keeps the on-fail photo behaviour
  // working regardless of what's stored for it.
  var PHOTOS_ON_FAIL_IDS = { pk4:true, pi3:true };
  function photoPolicyFor(q){
    if (!q) return { allow:false, onFail:false };
    var allow = !!q.allowPhotos, onFail = !!q.photosOnFail;
    if (PHOTOS_ON_FAIL_IDS[q.id]){ allow = true; onFail = true; }
    return { allow: allow, onFail: onFail };
  }
  function photosActiveFor(type, idx, q){
    var policy = photoPolicyFor(q);
    if (!policy.allow) return false;
    if (!policy.onFail) return true;
    var a = draft[type].answers[idx];
    return isBadAnswer(type, idx, a.result);
  }
  function refreshCommentState(qe, type, idx){
    var missing = commentMissing(type, idx);
    qe.classList.toggle("missing-comment", missing);
    var q = topicsFor(type)[idx];
    if (q && q.requiresProductIdOnFail){
      var a = draft[type].answers[idx];
      var needsPid = isBadAnswer(type, idx, a.result);
      qe.classList.toggle("needs-productid", needsPid);
      qe.classList.toggle("missing-productid", productIdMissing(type, idx));
    }
    if (q) refreshPhotoAddVisibility(qe, type, idx, q);
  }
  // Adds or removes the camera "add photo" control live (without a full
  // re-render, so the comment textarea and other fields on the same
  // question keep their focus/state) whenever the answer changes and this
  // question only offers photos on a failing answer. Already-attached
  // photos stay visible either way — only the ability to add more toggles.
  function refreshPhotoAddVisibility(qe, type, idx, q){
    var policy = photoPolicyFor(q);
    if (!policy.allow || !policy.onFail) return;
    var optrow = qe.querySelector(".optrow");
    if (!optrow) return;
    var active = photosActiveFor(type, idx, q);
    var existing = optrow.querySelector(".photo-addbtn");
    if (active && !existing){
      var label = document.createElement("label");
      label.className = "photo-addbtn";
      label.setAttribute("data-photo-add", idx);
      label.title = "Attach photo evidence";
      label.innerHTML = CAMERA_SVG + "<input type=\"file\" accept=\"image/*\" capture=\"environment\" multiple data-photo-input=\""+idx+"\" style=\"display:none\">";
      optrow.appendChild(label);
      label.querySelector("input").addEventListener("change", function(e){
        handlePhotoFiles(type, idx, e.target.files);
        e.target.value = "";
      });
    } else if (!active && existing){
      existing.remove();
    }
  }

  // --- Repeat-failure detection ------------------------------------------
  // Auditors write Op IDs inconsistently ("OP-10559", "FOP10559", "10559"…)
  // so every lookup/grouping goes through this normalizer first: strip
  // whitespace and dashes, uppercase, then drop a leading "FOP" (checked
  // before "OP", since it's the longer/more specific prefix) or "OP"
  // prefix, leaving the bare digit string as the canonical key.
  function normalizeOpId(raw){
    // Auditors separate the prefix from the digits with a dash, an
    // underscore, a space, or nothing at all ("OP-10559", "OP_10559",
    // "OP 10559", "OP10559") — all of that gets stripped before the
    // FOP/OP prefix check, so every spelling collapses to the same key.
    var s = String(raw||"").replace(/[\s_-]+/g,"").toUpperCase();
    if (!s) return "";
    if (s.indexOf("FOP") === 0) return s.slice(3);
    if (s.indexOf("OP") === 0) return s.slice(2);
    return s;
  }
  // A saved audit "failed" if any of its answers came back something other
  // than that question's own stored "good" value ("N/A" never counts as a
  // failure). Uses each answer's own snapshot, so this stays correct even
  // after the live checklist has since been edited — and applies the same
  // way to every question, Picking and Packing alike.
  function entryHasFailure(e){
    return (e.answers||[]).some(function(a){
      return !!a.result && a.result !== a.good && a.result !== "N/A";
    });
  }
  function entryFailedAnswers(e){
    return (e.answers||[]).filter(function(a){
      return !!a.result && a.result !== a.good && a.result !== "N/A";
    });
  }
  // Every failed audit of a given type sharing a normalized Op ID, all-time,
  // oldest first — backs the live inline warning while logging.
  function failedEntriesForOpId(type, opId){
    var norm = normalizeOpId(opId);
    if (!norm) return [];
    return STATE.entries.filter(function(e){
      return e.type === type && normalizeOpId(e.fields && e.fields.opId) === norm && entryHasFailure(e);
    }).sort(function(a,b){
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return SHIFTS.indexOf(a.shift) - SHIFTS.indexOf(b.shift);
    });
  }
  // Every Op ID (of one type) with 2 or more failed audits on record,
  // all-time — backs the standalone Repeat Failures tab.
  function repeatFailureGroups(type){
    var byNorm = {};
    STATE.entries.forEach(function(e){
      if (e.type !== type || !entryHasFailure(e)) return;
      var raw = (e.fields && e.fields.opId) || "";
      var norm = normalizeOpId(raw);
      if (!norm) return;
      (byNorm[norm] = byNorm[norm] || []).push(e);
    });
    var groups = Object.keys(byNorm).map(function(norm){
      var entries = byNorm[norm].slice().sort(function(a,b){
        if (a.date !== b.date) return a.date < b.date ? -1 : 1;
        return SHIFTS.indexOf(a.shift) - SHIFTS.indexOf(b.shift);
      });
      return { norm: norm, opId: entries[entries.length-1].fields.opId || norm, entries: entries };
    }).filter(function(g){ return g.entries.length >= 2; });
    groups.sort(function(a,b){ return b.entries.length - a.entries.length || (a.opId < b.opId ? -1 : 1); });
    return groups;
  }
  // Inline warning shown under the Op ID field while logging a new audit —
  // dates, shift, auditor and the failing question(s)/comments from every
  // prior failed audit for this same (normalized) Op ID, same type.
  function opIdWarningHtml(type, rawOpId){
    var failed = failedEntriesForOpId(type, rawOpId);
    if (failed.length < 2) return "";
    var html = "<div class=\"opid-warning-title\">"+failed.length+" prior failed "+type.toLowerCase()+" audits for this Op ID</div>";
    failed.slice().reverse().forEach(function(e){
      var badAnswers = entryFailedAnswers(e);
      html += "<div class=\"opid-warning-item\">";
      html += "<div class=\"opid-warning-meta\">"+headingLabel(parseIso(e.date))+" &middot; "+e.shift+(e.auditor?" &middot; "+esc(e.auditor):"")+"</div>";
      badAnswers.forEach(function(a){
        html += "<div>"+esc(a.text)+": <strong>"+esc(a.result)+"</strong></div>";
        if (a.comment) html += "<div class=\"opid-warning-comment\">&ldquo;"+esc(a.comment)+"&rdquo;</div>";
      });
      html += "</div>";
    });
    return html;
  }
  function refreshOpIdWarning(type, inputEl){
    var container = inputEl.parentNode.querySelector("[data-opid-warning]");
    if (!container) return;
    var html = opIdWarningHtml(type, inputEl.value);
    container.innerHTML = html;
    container.classList.toggle("show", !!html);
  }

  function entriesFor(type){
    var d = isoDate(view.date);
    return STATE.entries.filter(function(e){ return e.date===d && e.shift===view.shift && e.type===type; });
  }
  // Every audit logged in a given month, across both audit types — used by
  // the Monthly Summary's CSV export so one click covers the whole month.
  function monthEntriesAll(ym){
    return STATE.entries.filter(function(e){ return e.date.slice(0,7)===ym; }).sort(function(a,b){
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      if (a.shift !== b.shift) return SHIFTS.indexOf(a.shift) - SHIFTS.indexOf(b.shift);
      return a.type < b.type ? -1 : (a.type > b.type ? 1 : 0);
    });
  }
  // Every audit of one type logged in a given month — backs the Monthly
  // Summary's "N Picking / N Packing audits" counts and their open lists.
  function monthEntriesFor(type, ym){
    return STATE.entries.filter(function(e){ return e.type===type && e.date.slice(0,7)===ym; }).sort(function(a,b){
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return SHIFTS.indexOf(a.shift) - SHIFTS.indexOf(b.shift);
    });
  }
  // Every audit logged for the selected date+shift, across both audit types
  // — used by the Daily Summary's CSV export, same shape as monthEntriesAll.
  function dayEntriesAll(){
    var d = isoDate(view.date);
    return STATE.entries.filter(function(e){ return e.date===d && e.shift===view.shift; }).sort(function(a,b){
      return a.type < b.type ? -1 : (a.type > b.type ? 1 : 0);
    });
  }

  function buildMonthOptions(sel){
    sel.innerHTML = "";
    var end = new Date(today.getFullYear(), today.getMonth()+1, 1);
    if (end < RANGE_START) end = new Date(RANGE_START.getFullYear(), RANGE_START.getMonth(), 1);
    var d = new Date(RANGE_START.getFullYear(), RANGE_START.getMonth(), 1);
    while (d <= end){
      var opt = document.createElement("option");
      opt.value = monthKey(d); opt.textContent = monthLabel(d);
      if (sameMonth(d, view.month)) opt.selected = true;
      sel.appendChild(opt);
      d = new Date(d.getFullYear(), d.getMonth()+1, 1);
    }
  }

  function autoGrow(ta){ if(!ta) return; ta.style.height="auto"; ta.style.height=(ta.scrollHeight+2)+"px"; }

  // Renders one form field's markup (select / scannable / plain text) —
  // shared by the top field row and by any field flagged afterChecklist,
  // which renders in its own row below the checklist questions instead.
  function fieldHtml(f){
    if (f.type === "select"){
      return "<div class=\"fld\"><span class=\"field-label\">"+f.label+"</span><select class=\"sel txt-sel\" data-field=\""+f.key+"\">" +
              "<option value=\"\">Select…</option>" +
              f.options.map(function(o){ return "<option value=\""+o+"\">"+o+"</option>"; }).join("") +
              "</select></div>";
    } else if (f.scannable){
      return "<div class=\"fld\"><span class=\"field-label\">"+f.label+"</span>" +
              "<div class=\"scanfld\">" +
              "<input class=\"txt\" data-field=\""+f.key+"\" placeholder=\""+f.placeholder+"\">" +
              "<button type=\"button\" class=\"scanbtn\" data-scan-field=\""+f.key+"\" title=\"Scan barcode\">"+BARCODE_SVG+"</button>" +
              "</div></div>";
    }
    var opidWarning = f.key === "opId" ? "<div class=\"opid-warning\" data-opid-warning=\"1\"></div>" : "";
    return "<div class=\"fld\"><span class=\"field-label\">"+f.label+"</span><input class=\"txt\" data-field=\""+f.key+"\" placeholder=\""+f.placeholder+"\">"+opidWarning+"</div>";
  }

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  function escAttr(s){ return esc(s).replace(/"/g,"&quot;"); }

  // Highlight the first case-insensitive match of q inside text, HTML-escaped.
  function highlight(text, q){
    var t = String(text==null?"":text);
    if (!q) return esc(t);
    var idx = t.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return esc(t);
    return esc(t.slice(0,idx)) + "<mark>" + esc(t.slice(idx, idx+q.length)) + "</mark>" + esc(t.slice(idx+q.length));
  }

  // The compact identifier line shown for a logged audit — leads with the
  // auditor's name (if recorded) so it's visible at a glance, then whatever
  // fields the audit type has (bench number, Op ID).
  function idLabelFor(e){
    var t = TYPES[e.type]; if (!t) return e.auditor || "—";
    var rest = t.fields.map(function(f){ return e.fields[f.key]; }).filter(Boolean).join(" · ");
    if (e.auditor && rest) return e.auditor + " · " + rest;
    return e.auditor || rest || "—";
  }

  // Does this entry's auditor / Op ID / bench field or any answer comment contain q?
  // Answer text/labels come from the entry's own stored snapshot, not the
  // current checklist, so search still works correctly on old entries even
  // after the checklist has been edited.
  function entryMatch(e, q){
    var t = TYPES[e.type]; if (!t) return null;
    var ql = q.toLowerCase();
    if (e.auditor && String(e.auditor).toLowerCase().indexOf(ql) !== -1) return { kind:"field", label:"Auditor", text:e.auditor };
    for (var i=0;i<t.fields.length;i++){
      var key = t.fields[i].key, val = e.fields[key];
      if (val && String(val).toLowerCase().indexOf(ql) !== -1) return { kind:"field", label:t.fields[i].label, text:val };
    }
    for (var j=0;j<e.answers.length;j++){
      var a = e.answers[j];
      var c = a && a.comment;
      if (c && c.toLowerCase().indexOf(ql) !== -1) return { kind:"comment", label:(a && a.text)||"Comment", text:c };
      var pid = a && a.productId;
      if (pid && String(pid).toLowerCase().indexOf(ql) !== -1) return { kind:"comment", label:"Product ID", text:pid };
    }
    return null;
  }

  function searchResults(q){
    if (!q || !q.trim()) return [];
    var ql = q.trim();
    var out = [];
    STATE.entries.forEach(function(e){
      var m = entryMatch(e, ql);
      if (m) out.push({ entry:e, match:m });
    });
    out.sort(function(a,b){
      if (a.entry.date !== b.entry.date) return a.entry.date < b.entry.date ? 1 : -1;
      return SHIFTS.indexOf(a.entry.shift) - SHIFTS.indexOf(b.entry.shift);
    });
    return out;
  }

  function parseIso(iso){ var p = iso.split("-"); return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)); }

  function csvCell(v){
    var s = String(v==null ? "" : v);
    if (/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
  function csvRow(cells){ return cells.map(csvCell).join(","); }

  // Question count varies across entries once the checklist has been edited
  // over time, so the column count is computed from the entries actually
  // being exported, and each row's question text/answer comes from that
  // entry's own stored snapshot rather than the current checklist.
  function buildCsv(entries){
    var maxQ = 0;
    entries.forEach(function(e){ if (e.answers.length > maxQ) maxQ = e.answers.length; });
    var header = ["Date","Shift","Type","Auditor","Bench","Op ID","Outbound Container No.","Tracking Number"];
    for (var i=1;i<=maxQ;i++){ header.push("Question "+i, "Answer "+i, "Comment "+i, "Product ID "+i, "Photos "+i); }
    var lines = [csvRow(header)];
    entries.forEach(function(e){
      var row = [e.date, e.shift, e.type, e.auditor || "", e.fields.bench || "", e.fields.opId || "", e.fields.outboundContainerNo || "", e.fields.trackingNumber || ""];
      for (var i=0;i<maxQ;i++){
        var a = e.answers[i];
        if (a){
          var photoPaths = (a.photos||[]).map(function(p){ return p.path; }).filter(Boolean).join("; ");
          row.push(a.text || "", a.result || "", a.comment || "", a.productId || "", photoPaths);
        }
        else { row.push("", "", "", "", ""); }
      }
      lines.push(csvRow(row));
    });
    return "﻿" + lines.join("\r\n") + "\r\n";
  }

  // A plain, ordinary browser download — no special capability needed here,
  // since this page isn't running inside the artifact sandbox. Works for
  // every visitor, every time.
  // exportType ("All" | "Picking" | "Packing") narrows both Export CSV
  // buttons to just one audit type when the visitor wants that instead of
  // everything.
  function monthEntriesForExport(ym){
    return exportType === "All" ? monthEntriesAll(ym) : monthEntriesFor(exportType, ym);
  }
  function dayEntriesForExport(){
    return exportType === "All" ? dayEntriesAll() : entriesFor(exportType);
  }

  function exportMonth(){
    var ym = monthKey(view.month);
    var entries = monthEntriesForExport(ym);
    if (!entries.length) return;
    var csv = buildCsv(entries);
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var typeSuffix = exportType === "All" ? "" : "-" + exportType;
    a.href = url;
    a.download = "audits-" + ym + typeSuffix + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    var typeLabel = exportType === "All" ? "" : exportType + " ";
    exportMsg = "Exported " + entries.length + " " + typeLabel + "audit" + (entries.length===1?"":"s") + " for " + monthLabel(view.month).replace("This month — ", "") + " to CSV.";
    render();
  }

  // Same idea as exportMonth(), scoped to the selected date+shift instead of
  // a whole month — the Daily Summary's Export CSV button.
  function exportDay(){
    var entries = dayEntriesForExport();
    if (!entries.length) return;
    var csv = buildCsv(entries);
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var d = isoDate(view.date);
    var typeSuffix = exportType === "All" ? "" : "-" + exportType;
    a.href = url;
    a.download = "audits-" + d + "-" + view.shift + typeSuffix + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    var typeLabel = exportType === "All" ? "" : exportType + " ";
    dayExportMsg = "Exported " + entries.length + " " + typeLabel + "audit" + (entries.length===1?"":"s") + " for " + headingLabel(view.date) + " (" + view.shift + ") to CSV.";
    render();
  }

  // Every failed audit, of one type, that belongs to a flagged (2+ repeat
  // failure) Op ID — backs the Repeat Failures tab's own CSV export, which
  // has its own Picking/Packing selector independent of the Summary tab's.
  function repeatExportEntriesFor(type){
    var groups = repeatFailureGroups(type);
    var ids = {};
    groups.forEach(function(g){ g.entries.forEach(function(e){ ids[e.id] = true; }); });
    return STATE.entries.filter(function(e){ return e.type === type && ids[e.id]; }).sort(function(a,b){
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return SHIFTS.indexOf(a.shift) - SHIFTS.indexOf(b.shift);
    });
  }
  function exportRepeatFailures(){
    var entries = repeatExportEntriesFor(repeatExportType);
    if (!entries.length) return;
    var csv = buildCsv(entries);
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "repeat-failures-" + repeatExportType + "-" + isoDate(today) + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    repeatExportMsg = "Exported " + entries.length + " failed " + repeatExportType + " audit" + (entries.length===1?"":"s") + " across flagged Op IDs to CSV.";
    render();
  }

  // Barcode scanning for a form field (currently just Packing's Tracking
  // Number) — opens a full-screen camera overlay via the ZXing library and
  // fills the field as soon as a barcode is decoded.
  function openScanner(type, fieldKey){
    scanState = { open:true, error:"", type:type, field:fieldKey };
    render();
  }
  function stopScanner(){
    if (scanControls){ try{ scanControls.stop(); }catch(e){} scanControls = null; }
    scanStarting = false;
  }
  function closeScanner(){
    stopScanner();
    scanState = { open:false, error:"", type:null, field:null };
    render();
  }
  // Decode hint keys aren't publicly exported by the @zxing/browser bundle
  // (only the separate @zxing/library package exports DecodeHintType), but
  // they're stable numeric constants of the underlying library, so they're
  // safe to use directly rather than pulling in a second ~360KB bundle just
  // for two enum values.
  var ZXING_HINT_POSSIBLE_FORMATS = 2;
  var ZXING_HINT_TRY_HARDER = 3;
  function buildScanHints(){
    var hints = new Map();
    try {
      var BF = window.ZXingBrowser && ZXingBrowser.BarcodeFormat;
      if (BF){
        var formats = [BF.CODE_128, BF.CODE_39, BF.ITF, BF.CODABAR, BF.EAN_13, BF.EAN_8, BF.UPC_A, BF.UPC_E, BF.QR_CODE, BF.DATA_MATRIX]
          .filter(function(f){ return f !== undefined; });
        if (formats.length) hints.set(ZXING_HINT_POSSIBLE_FORMATS, formats);
      }
    } catch(e){}
    // Makes the decoder spend more effort per frame, which specifically
    // helps with small, dense, or lower-contrast barcodes.
    hints.set(ZXING_HINT_TRY_HARDER, true);
    return hints;
  }
  function startScanner(){
    if (scanStarting || scanControls) return; // already running or starting
    if (!window.ZXingBrowser){
      scanState.error = "Barcode scanning isn't supported in this browser.";
      render();
      return;
    }
    var videoEl = document.getElementById("scanVideo");
    if (!videoEl) return; // overlay was closed before this ran
    scanStarting = true;
    if (!zxingReader) zxingReader = new ZXingBrowser.BrowserMultiFormatReader(buildScanHints());
    zxingReader.decodeFromConstraints(
      { video: {
          facingMode: "environment",
          // Higher-resolution frames give the decoder more pixel detail to
          // work with, which matters most for small barcodes — most phone
          // and laptop cameras support this even if they default lower.
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          // Ignored by browsers that don't support it; on those that do
          // (mainly Android Chrome) it keeps small/close-up barcodes sharp
          // instead of relying on a fixed focus distance.
          advanced: [{ focusMode: "continuous" }]
        } },
      videoEl,
      function(result){
        // Fires continuously while scanning; result is only set on an
        // actual decode; every other frame comes through as a harmless
        // "not found" error that's fine to ignore.
        if (!result) return;
        var text = result.getText ? result.getText() : "";
        if (text) applyScanResult(text);
      }
    ).then(function(controls){
      scanStarting = false;
      scanControls = controls;
    }).catch(function(e){
      scanStarting = false;
      scanState.error = (e && e.name === "NotAllowedError")
        ? "Camera access was denied. You can allow it in your browser's site settings, or just type the number in."
        : "Couldn't access the camera. You can type the number in instead.";
      render();
    });
  }
  function applyScanResult(text){
    var type = scanState.type, key = scanState.field;
    stopScanner();
    scanState = { open:false, error:"", type:null, field:null };
    if (type && key){
      ensureDraft(type);
      draft[type].fields[key] = text;
    }
    render();
  }

  // Working copy of a type's checklist topics used while its "Edit checklist"
  // panel is open, cloned from whatever's currently in effect so edits don't
  // touch live state until Save is pressed.
  function ensureTopicsDraft(type){
    if (!topicsDraft[type]){
      topicsDraft[type] = topicsFor(type).map(function(tp){ return { id:tp.id, text:tp.text, options:tp.options.slice(), good:tp.good, allowPhotos: !!tp.allowPhotos, photosOnFail: !!tp.photosOnFail, requiresProductIdOnFail: !!tp.requiresProductIdOnFail }; });
    }
  }

  function renderTopicsLock(type){
    var html = "";
    html += "  <div class=\"topics-lock\" data-topics-lock=\""+type+"\">";
    html += "    <p>Enter the passcode to edit the "+type.toLowerCase()+" checklist.</p>";
    html += "    <input class=\"txt\" type=\"password\" autocomplete=\"off\" placeholder=\"Passcode\">";
    html += "    <div class=\"danger-err"+(topicsLockError[type]?" show":"")+"\">"+esc(topicsLockError[type]||"")+"</div>";
    html += "    <div class=\"form-actions\"><button type=\"button\" class=\"btn primary\" data-topics-unlock=\""+type+"\">Unlock</button><button type=\"button\" class=\"btn ghost\" data-topics-lock-cancel=\""+type+"\">Cancel</button></div>";
    html += "  </div>";
    return html;
  }

  function validTopicsDraft(type){
    var list = topicsDraft[type];
    if (!list || !list.length) return false;
    for (var i=0;i<list.length;i++){
      if (!list[i].text || !list[i].text.trim()) return false;
      if (!list[i].options || list[i].options.length<2) return false;
      if (list[i].options.indexOf(list[i].good) === -1) return false;
    }
    return true;
  }

  function renderTopicsEditor(type){
    ensureTopicsDraft(type);
    var list = topicsDraft[type];
    var html = "";
    html += "  <div class=\"topics-editor\" data-topics-panel=\""+type+"\">";
    html += "    <div class=\"topics-intro\">Add, edit, reorder or remove the questions used on every new "+type+" audit. Audits already logged keep the wording and passing answer that applied when they were saved.</div>";
    list.forEach(function(tp, idx){
      html += "    <div class=\"topic-row\" data-topic-idx=\""+idx+"\">";
      html += "      <div class=\"topic-row-top\"><span class=\"topic-num mono\">"+(idx+1)+".</span>";
      html += "        <input class=\"txt topic-text\" placeholder=\"Checklist question\" value=\""+escAttr(tp.text)+"\">";
      html += "        <div class=\"topic-row-actions\">";
      html += "          <button type=\"button\" class=\"iconbtn\" data-topic-up=\""+idx+"\""+(idx===0?" disabled":"")+" title=\"Move up\">&uarr;</button>";
      html += "          <button type=\"button\" class=\"iconbtn\" data-topic-down=\""+idx+"\""+(idx===list.length-1?" disabled":"")+" title=\"Move down\">&darr;</button>";
      html += "          <button type=\"button\" class=\"iconbtn danger\" data-topic-remove=\""+idx+"\" title=\"Remove question\">&times;</button>";
      html += "        </div></div>";
      html += "      <div class=\"topic-row-opts\">";
      html += "        <div class=\"fld\"><span class=\"field-label\">Answer options</span><input class=\"txt topic-options\" value=\""+escAttr(tp.options.join(", "))+"\" placeholder=\"Yes, No\"></div>";
      html += "        <div class=\"fld\"><span class=\"field-label\">Passing answer</span><select class=\"sel txt-sel topic-good\">" +
                tp.options.map(function(o){ return "<option value=\""+escAttr(o)+"\""+(o===tp.good?" selected":"")+">"+esc(o)+"</option>"; }).join("") +
              "</select></div>";
      html += "        <div class=\"fld photo-opt-fld\"><span class=\"field-label\">&nbsp;</span><label class=\"photo-allow-label\"><input type=\"checkbox\" class=\"topic-allowphotos\""+(tp.allowPhotos?" checked":"")+"> Allow photo evidence</label></div>";
      html += "      </div>";
      html += "    </div>";
    });
    html += "    <button type=\"button\" class=\"btn ghost topics-addbtn\" data-topic-add=\""+type+"\">+ Add checklist question</button>";
    html += "    <div class=\"form-err\" data-topicserr=\""+type+"\">Every question needs wording, at least two answer options, and a passing answer among them.</div>";
    html += "    <div class=\"form-actions\"><button type=\"button\" class=\"btn primary\" data-topics-save=\""+type+"\">Save checklist</button><button type=\"button\" class=\"btn ghost\" data-topics-cancel=\""+type+"\">Cancel</button></div>";
    html += "  </div>";
    return html;
  }

    html += "    <div><h1>Picking &amp; Packing Audits Board</h1><div class=\"sub\">Picking &middot; Packing</div></div></div>";

    // The Daily/Monthly toggle only appears on the Summary page — it swaps
    // the whole controls row and content below between the per-date entry
    // list and the whole-month pass-rate view (the former separate "Monthly" page).
    function summaryModePillsHtml(){
      return "<div><span class=\"field-label\">View</span><div class=\"pillgroup\" id=\"summaryModePills\">" +
        ["date","month"].map(function(m){
          var label = m==="date" ? "Daily" : "Monthly";
          return "<button type=\"button\" class=\"pill"+(view.summaryMode===m?" active":"")+"\" data-summary-mode=\""+m+"\">"+label+"</button>";
        }).join("") + "</div></div>";
    }

    // Shared by both the Daily and Monthly Export CSV boxes, so exporting
    // just Picking or just Packing works the same way in either view.
    function exportTypePillsHtml(){
      return "<div class=\"pillgroup exporttype-pills\" id=\"exportTypePills\">" +
        ["All","Picking","Packing"].map(function(t){
          return "<button type=\"button\" class=\"pill"+(exportType===t?" active":"")+"\" data-export-type=\""+t+"\">"+t+"</button>";
        }).join("") + "</div>";
    }

    if (isSearch){
      html += "  <div class=\"controls\">";
      html += "    <div class=\"search-row\">";
      html += "      <div class=\"search-box\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>" +
              "<input class=\"txt\" id=\"searchInput\" placeholder=\"Search by auditor, Op ID, bench number or comment…\" value=\""+escAttr(search.query)+"\"></div>";
      html += "      <button type=\"button\" class=\"search-clear\" id=\"searchClear\">Clear</button>";
      html += "    </div>";
      html += "    <div class=\"search-hint\">Searches every logged Picking and Packing audit, across every date and shift.</div>";
      html += "  </div>";
    } else if (isSummaryMonth){
      html += "  <div class=\"controls\"><div class=\"control-row\">";
      html += "    " + summaryModePillsHtml();
      html += "    <div><span class=\"field-label\">Month</span><select id=\"monthSel\" class=\"sel mono\"></select></div>";
      html += "  </div>";
      html += "  </div>";
    } else if (isRepeat){
      html += "  <div class=\"controls\"><div class=\"helper\">Op IDs with 2 or more failed audits on record, across every date and shift.</div></div>";
    } else {
      html += "  <div class=\"controls\"><div class=\"control-row\">";
      if (isSummary){ html += "    " + summaryModePillsHtml(); }
      html += "    <div class=\"datefield\"><span class=\"field-label\">Date</span><button type=\"button\" class=\"datebtn mono\" id=\"dateBtn\">"+shortDateLabel(view.date)+"</button></div>";
      html += "    <div><span class=\"field-label\">Shift</span><select id=\"shiftSel\" class=\"sel mono\">" +
                SHIFTS.map(function(s){ return "<option value=\""+s+"\""+(s===view.shift?" selected":"")+">"+s+"</option>"; }).join("") + "</select></div>";
      if (!isSummary){
        html += "    <div><span class=\"field-label\">Audit Type</span><div class=\"pillgroup\" id=\"pillgroup\">" +
                  TYPE_KEYS.map(function(t){ return "<button type=\"button\" class=\"pill"+(view.type===t?" active":"")+"\" data-type=\""+t+"\">"+t+"</button>"; }).join("") +
                "</div></div>";
      }
      html += "  </div>";
      if (dateCalOpen) html += calendarPanelHtml();
      if (isSummary){
        html += "  <div class=\"helper\">Pick a date and shift, then press a count below to see those audits.</div>";
      }
      html += "  </div>";
    }

    if (!isSummaryMonth && !isSearch && !isRepeat){
      html += "  <div class=\"dayhead\">" + headingLabel(view.date) + "<span class=\"shift-tag\">" + view.shift + "</span></div>";
    }

    // Compact "how many were carried out" counts. Both Daily and Monthly work
    // the same way: pressing a count opens that type's entries below, and
    // pressing the same count again closes (retracts) them.
    if (isSummary && !isSummaryMonth && !isSearch){
      var dayPickingCount = entriesFor("Picking").length;
      var dayPackingCount = entriesFor("Packing").length;
      html += "  <div class=\"countsbar\">";
      html += "    <button type=\"button\" class=\"countchip"+(dayOpenType==="Picking"?" active":"")+"\" data-select-type=\"Picking\">"+dayPickingCount+" Picking audit"+(dayPickingCount===1?"":"s")+"</button>";
      html += "    <button type=\"button\" class=\"countchip"+(dayOpenType==="Packing"?" active":"")+"\" data-select-type=\"Packing\">"+dayPackingCount+" Packing audit"+(dayPackingCount===1?"":"s")+"</button>";
      html += "    <span class=\"countsbar-label\">carried out</span>";
      html += "  </div>";
    } else if (isSummaryMonth){

      var monthPickingCount = monthEntriesFor("Picking", monthYm).length;
      var monthPackingCount = monthEntriesFor("Packing", monthYm).length;
      html += "  <div class=\"countsbar\">";
      html += "    <button type=\"button\" class=\"countchip"+(monthOpenType==="Picking"?" active":"")+"\" data-open-type=\"Picking\">"+monthPickingCount+" Picking audit"+(monthPickingCount===1?"":"s")+"</button>";
      html += "    <button type=\"button\" class=\"countchip"+(monthOpenType==="Packing"?" active":"")+"\" data-open-type=\"Packing\">"+monthPackingCount+" Packing audit"+(monthPackingCount===1?"":"s")+"</button>";

      html += "  </div>";
      if (monthOpenType){
        var monthOpenEntries = monthEntriesFor(monthOpenType, monthYm);

          html += "    <div class=\"empty-list\">No "+monthOpenType.toLowerCase()+" audits logged this month yet.</div>";

            html += "    <div class=\"result\" data-open-id=\""+e.id+"\">";

              if (isOpIdField) refreshOpIdWarning(type, inp);
            });
            if (isOpIdField) refreshOpIdWarning(type, inp);
          });
          form.querySelectorAll("[data-scan-field]").forEach(function(btn){
            btn.addEventListener("click", function(){ openScanner(type, btn.getAttribute("data-scan-field")); });
          });
          form.querySelectorAll("select.txt-sel").forEach(function(sel){
            sel.value = d.fields[sel.getAttribute("data-field")] || "";
            sel.addEventListener("change", function(){ d.fields[sel.getAttribute("data-field")] = sel.value; });
          });
          form.querySelectorAll(".qentry").forEach(function(qe){
            var idx = parseInt(qe.getAttribute("data-qidx"),10);
            var ta = qe.querySelector("textarea.comment");
            ta.value = d.answers[idx].comment || ""; autoGrow(ta);
            ta.addEventListener("input", function(){ d.answers[idx].comment = ta.value; autoGrow(ta); refreshCommentState(qe, type, idx); });
            var pidInp = qe.querySelector("[data-productid='"+idx+"']");
            if (pidInp){
              pidInp.value = d.answers[idx].productId || "";
              pidInp.addEventListener("input", function(){ d.answers[idx].productId = pidInp.value; refreshCommentState(qe, type, idx); });
            }
            qe.querySelectorAll(".opt").forEach(function(btn){
              btn.addEventListener("click", function(){
                var val = btn.getAttribute("data-opt");
                var alreadyChosen = d.answers[idx].result === val;
                d.answers[idx].result = alreadyChosen ? "" : val;
                qe.querySelectorAll(".opt").forEach(function(b){ b.classList.remove("chosen"); });
                if (!alreadyChosen) btn.classList.add("chosen");
                refreshCommentState(qe, type, idx);
              });
            });
            var photoInput = qe.querySelector('[data-photo-input="'+idx+'"]');
            if (photoInput) photoInput.addEventListener("change", function(e){
              handlePhotoFiles(type, idx, e.target.files);
              e.target.value = "";
            });
            qe.querySelectorAll(".photo-remove").forEach(function(btn){
              btn.addEventListener("click", function(e){
                e.stopPropagation();
                removePhotoAt(type, idx, btn.getAttribute("data-photo-id"));
              });
            });
          });
          section.querySelector('[data-save="'+type+'"]').addEventListener("click", function(){ saveEntry(type); });
        }
      });
    }

  }

  function validDraft(type){
    var d = draft[type], t = TYPES[type];
    if (!d.auditor || !d.auditor.trim()) return false;
    for (var i=0;i<t.fields.length;i++){ if (!d.fields[t.fields[i].key] || !d.fields[t.fields[i].key].trim()) return false; }
    for (var j=0;j<d.answers.length;j++){
      if (!d.answers[j].result) return false;
      if (commentMissing(type, j)) return false;
      if (productIdMissing(type, j)) return false;
      var photos = d.answers[j].photos;
      if (photos && photos.some(function(p){ return p.uploading; })) return false;
    }
    return true;
  }

  function showBanner(msg){ var b=document.getElementById("banner"); if(!b) return; b.textContent=msg; b.classList.add("show"); }
  function setStatus(kind, msg){
    var line = document.getElementById("statusline"); if (!line) return;
    line.className = "statusline"+(kind?" "+kind:"");
    document.getElementById("statusText").textContent = msg || "";
    if (kind === "saved"){ setTimeout(function(){ if (line.className.indexOf("saved")>-1){ line.className="statusline"; document.getElementById("statusText").textContent=""; } }, 2200); }
  }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  // Backfills qid/text/good on any answer that predates this field (i.e. was
  // saved by an older version of this board), using the position-matched
  // default topic — the original hardcoded questions never changed order, so
  // this mapping is exact for legacy data. Newer entries already carry these
  // fields and pass through untouched.
  function normalizeEntries(entries){
    (entries || []).forEach(function(e){
      var defaults = DEFAULT_TOPICS[e.type] || [];
      (e.answers || []).forEach(function(a, idx){
        if (a.qid === undefined){
          var def = defaults[idx];
          a.qid = def ? def.id : ("legacy_"+idx);
          a.text = def ? def.text : ("Question "+(idx+1));
          a.good = def ? def.good : "Yes";
        }
        if (!Array.isArray(a.photos)) a.photos = [];
      });
    });
    return entries;
  }

  async function fetchRemote(){
    if (!supabase) return { entries: [] };
    try{
      var entriesRes = await supabase.from("audit_entries").select("*").order("created_at", { ascending:true });
      if (entriesRes.error) throw entriesRes.error;
      var entries = (entriesRes.data || []).map(function(row){
        return {
          id: row.id, date: row.date, shift: row.shift, type: row.type, auditor: row.auditor,
          fields: row.fields || {}, answers: row.answers || [], loggedAt: row.logged_at || row.date
        };
      });
      var out = { entries: normalizeEntries(entries) };
      var topicsRes = await supabase.from("checklist_topics").select("*");
      if (!topicsRes.error && topicsRes.data && topicsRes.data.length){
        var topics = {};
        topicsRes.data.forEach(function(row){ topics[row.type] = row.topics; });
        out.topics = topics;
      }
      return out;
    }catch(e){ return { entries: [] }; }
  }

  function makeId(){ return Math.random().toString(36).slice(2,10); }

  // Local preview while a photo is attached/uploading uses an object URL;
  // once uploaded, the persisted path (a relative path under this artifact,
  // fetchable like data/audits.json) is used instead.
  function photoDisplaySrc(ph){ return (ph && (ph.localUrl || ph.path)) || ""; }

  function revokeDraftPhotoUrls(d){
    if (!d) return;
    (d.answers || []).forEach(function(a){
      (a.photos || []).forEach(function(p){ if (p.localUrl){ try{ URL.revokeObjectURL(p.localUrl); }catch(e){} } });
    });
  }

  // Downscales/compresses an image client-side before upload, using a canvas.
  // Falls back to the original file untouched if image decoding or canvas
  // support isn't available (e.g. no real <canvas> 2D backend) or takes too
  // long, so a photo never gets stuck because of this optimization step.
  function resizeImageFile(file){
    return new Promise(function(resolve){
      try{
        if (typeof Image === "undefined" || typeof document.createElement("canvas").getContext !== "function"){ resolve(file); return; }
        var img = new Image();
        var url = URL.createObjectURL(file);
        var settled = false;
        var timer = setTimeout(function(){
          if (settled) return; settled = true;
          try{ URL.revokeObjectURL(url); }catch(e){}
          resolve(file);
        }, 1500);
        img.onload = function(){
          if (settled) return; settled = true; clearTimeout(timer);
          try{
            var maxDim = 1600;
            var w = img.naturalWidth, h = img.naturalHeight;
            if (!w || !h){ URL.revokeObjectURL(url); resolve(file); return; }
            var scale = Math.min(1, maxDim / Math.max(w,h));
            var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
            var canvas = document.createElement("canvas");
            canvas.width = cw; canvas.height = ch;
            var ctx = canvas.getContext("2d");
            if (!ctx || typeof canvas.toBlob !== "function"){ URL.revokeObjectURL(url); resolve(file); return; }
            ctx.drawImage(img, 0, 0, cw, ch);
            URL.revokeObjectURL(url);
            canvas.toBlob(function(blob){ resolve(blob || file); }, "image/jpeg", 0.82);
          }catch(e){ try{ URL.revokeObjectURL(url); }catch(e2){} resolve(file); }
        };
        img.onerror = function(){
          if (settled) return; settled = true; clearTimeout(timer);
          try{ URL.revokeObjectURL(url); }catch(e){}
          resolve(file);
        };
        img.src = url;
      }catch(e){ resolve(file); }
    });
  }

  function handlePhotoFiles(type, idx, fileList){
    var files = Array.from(fileList || []);
    files.forEach(function(file){
      if (!file || file.type.indexOf("image/") !== 0) return;
      var photo = { id: makeId(), localUrl: null, path: null, uploading: true, error: null };
      try{ photo.localUrl = URL.createObjectURL(file); }catch(e){}
      draft[type].answers[idx].photos.push(photo);
      render();
      uploadOnePhoto(type, idx, photo, file);
    });
  }

  async function uploadOnePhoto(type, idx, photo, file){
    if (!supabase || readOnly){
      photo.uploading = false;
      photo.error = "Can't upload here — kept for this session only.";
      render();
      return;
    }
    try{
      var blob = await resizeImageFile(file);
      var ext = (blob && blob.type === "image/png") ? "png" : "jpg";
      var path = photo.id + "." + ext;
      var upRes = await supabase.storage.from(PHOTOS_BUCKET).upload(path, blob, { contentType: (blob && blob.type) || "image/jpeg", upsert:false });
      if (upRes.error) throw upRes.error;
      var pub = supabase.storage.from(PHOTOS_BUCKET).getPublicUrl(path);
      photo.path = pub && pub.data ? pub.data.publicUrl : path;
      photo.uploading = false;
      render();
    }catch(err){
      photo.uploading = false;
      photo.error = "Upload failed — remove and try again.";
      render();
    }
  }

  function removePhotoAt(type, idx, photoId){
    var photos = draft[type].answers[idx].photos;
    var pos = -1;
    for (var i=0;i<photos.length;i++){ if (photos[i].id === photoId){ pos = i; break; } }
    if (pos === -1) return;
    var removed = photos[pos];
    if (removed.localUrl){ try{ URL.revokeObjectURL(removed.localUrl); }catch(e){} }
    photos.splice(pos,1);
    render();
  }

  async function saveEntry(type){
    var errEl = document.querySelector('[data-formerr="'+type+'"]');
    if (!validDraft(type)){ if (errEl) errEl.classList.add("show"); return; }
    if (errEl) errEl.classList.remove("show");

    var d = draft[type];
    var auditor = d.auditor.trim();
    // Photos that never finished uploading (or errored) are dropped rather
    // than persisted — the entry only ever references the persisted path,
    // never a local-only object URL.
    var cleanAnswers = d.answers.map(function(a){
      var photos = (a.photos||[]).filter(function(p){ return p.path && !p.uploading && !p.error; }).map(function(p){ return { path: p.path }; });
      return { qid:a.qid, text:a.text, good:a.good, result:a.result, comment:a.comment, productId:a.productId||"", photos: photos };
    });
    var entry = {
      id: makeId(), date: isoDate(view.date), shift: view.shift, type: type,
      auditor: auditor,
      fields: JSON.parse(JSON.stringify(d.fields)),
      answers: cleanAnswers,
      loggedAt: isoDate(view.date)
    };
    // the entry now carries the persisted path for each photo, so the local
    // previews backing this draft are no longer needed
    revokeDraftPhotoUrls(d);

    // optimistic local update — clear the form so it's ready for the next audit,
    // and stay on the Log page (the entry itself now only shows up on Summary).
    // The auditor field is left blank in the fresh draft so each audit
    // requires its own explicit auditor name.
    STATE.entries.push(entry);
    draft[type] = newDraft(type);
    render();

    if (readOnly || !supabase){ setStatus("saved", "Logged (this session only) — see it on Summary"); return; }
    setStatus("saving","Saving…");
    var ok = await tryPersist(entry, 0);
    setStatus(ok ? "saved" : "error", ok ? "Saved — see it on Summary" : "Couldn't save — try again in a moment");
  }

  // A plain row insert — unlike the old whole-file publish, two people saving
  // at the same moment can't collide, so this only needs to retry genuine
  // transient network errors, not merge conflicts.
  async function tryPersist(entry, attempt){
    try{
      var res = await supabase.from("audit_entries").insert([{
        id: entry.id, date: entry.date, shift: entry.shift, type: entry.type, auditor: entry.auditor,
        fields: entry.fields, answers: entry.answers, logged_at: entry.loggedAt
      }]);
      if (res.error) throw res.error;
      return true;
    }catch(err){
      if (attempt < 2){ await sleep(400+Math.random()*400); return tryPersist(entry, attempt+1); }
      return false;
    }
  }

  async function saveTopics(type){
    var errEl = document.querySelector('[data-topicserr="'+type+'"]');
    if (!validTopicsDraft(type)){ if (errEl) errEl.classList.add("show"); return; }
    if (errEl) errEl.classList.remove("show");

    var newTopics = topicsDraft[type].map(function(tp){ return { id:tp.id, text:tp.text.trim(), options:tp.options.slice(), good:tp.good, allowPhotos: !!tp.allowPhotos, photosOnFail: !!tp.photosOnFail, requiresProductIdOnFail: !!tp.requiresProductIdOnFail }; });

    // optimistic local update
    if (!STATE.topics) STATE.topics = {};
    STATE.topics[type] = newTopics;
    topicsPanelOpen[type] = false;
    topicsDraft[type] = null;
    draft[type] = newDraft(type); // realign the in-progress form with the new checklist
    render();

    if (readOnly || !supabase){ setStatus("saved", "Checklist updated (this session only)"); return; }
    setStatus("saving", "Saving checklist…");
    var ok = await tryPersistTopics(type, newTopics, 0);
    setStatus(ok ? "saved" : "error", ok ? "Checklist saved" : "Couldn't save checklist — try again in a moment");
  }

  async function tryPersistTopics(type, newTopics, attempt){
    try{
      var res = await supabase.from("checklist_topics").upsert([{ type: type, topics: newTopics, updated_at: new Date().toISOString() }], { onConflict: "type" });
      if (res.error) throw res.error;
      return true;
    }catch(err){
      if (attempt < 2){ await sleep(400+Math.random()*400); return tryPersistTopics(type, newTopics, attempt+1); }
      return false;
    }
  }

  async function clearAllData(){
    // optimistic local wipe — the checklist topics themselves aren't audit
    // data, so they're kept rather than reset to the defaults.
    STATE = { entries: [], topics: STATE.topics };
    clearPanelOpen = false; clearErrorMsg = "";
    render();

    if (readOnly || !supabase){ setStatus("saved", "Cleared (this session only) — nothing was shared"); return; }
    setStatus("saving", "Clearing…");
    var ok = await tryClearRemote(0);
    setStatus(ok ? "saved" : "error", ok ? "All summary data cleared" : "Couldn't clear — try again in a moment");
  }

  async function tryClearRemote(attempt){
    try{
      // Supabase requires an explicit filter on delete — this one matches every row.
      var res = await supabase.from("audit_entries").delete().not("id", "is", null);
      if (res.error) throw res.error;
      return true;
    }catch(err){
      if (attempt < 2){ await sleep(400+Math.random()*400); return tryClearRemote(attempt+1); }
      return false;
    }
  }

  async function init(){
    try{
      if (configOk && window.supabase && window.supabase.createClient){
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    }catch(e){ supabase = null; }
    if (!supabase){
      readOnly = true;
      configBannerMsg = configOk
        ? "Couldn't connect to the database — check the Supabase URL/key at the top of this file."
        : "This board isn't connected to a database yet — add your Supabase URL and anon key at the top of this file, then reload.";
    } else {
      var remote = await fetchRemote();
      if (remote && Array.isArray(remote.entries)) STATE = remote;
      subscribeRealtime();
    }
    render();
  }

  // Keeps every open tab in sync: whenever anyone logs an audit or edits the
  // checklist, every other open view quietly updates to match — the same
  // "everyone sees the same board" feel the artifact version had.
  //
  // Each change event from Supabase Realtime already carries the full
  // changed row (payload.new for an insert/update, payload.old's id for a
  // delete), so it's applied directly to STATE instead of re-fetching the
  // whole table. Fetching the whole table on every single change was the
  // real scaling risk here: with several tabs open, every tab was
  // re-downloading every audit ever logged in response to every save,
  // anywhere — a cost that grows with both the number of open tabs and the
  // total amount of data, even though any one change only ever touches a
  // single row. Scoping each update to just the row that actually changed
  // keeps ongoing sync cost flat as the board's history grows; only the
  // one-time load when a tab first opens still fetches everything (still
  // needed so Search and old dates keep working across the full history).
  function subscribeRealtime(){
    if (!supabase || !supabase.channel) return;
    try{
      supabase.channel("audits-sync")
        .on("postgres_changes", { event:"*", schema:"public", table:"audit_entries" }, queueEntryChange)
        .on("postgres_changes", { event:"*", schema:"public", table:"checklist_topics" }, queueTopicsChange)
        .subscribe();
    }catch(e){}
  }

  // Bursts of change events (e.g. "Clear all summary data" deletes every row
  // one event at a time, or several audits get saved in quick succession)
  // are coalesced into a single batch-apply-and-render, same 300ms window
  // the old full-refetch approach used, but without the refetch.
  var pendingEntryChanges = [];
  var pendingTopicsChanges = [];
  var applyPendingTimer = null;
  function queueEntryChange(payload){ pendingEntryChanges.push(payload); scheduleApplyPendingChanges(); }
  function queueTopicsChange(payload){ pendingTopicsChanges.push(payload); scheduleApplyPendingChanges(); }
  function scheduleApplyPendingChanges(){
    if (applyPendingTimer) return;
    applyPendingTimer = setTimeout(function(){
      applyPendingTimer = null;
      applyPendingChanges();
    }, 300);
  }
  function applyPendingChanges(){
    var changed = false;
    if (pendingEntryChanges.length){
      var entryChanges = pendingEntryChanges; pendingEntryChanges = [];
      entryChanges.forEach(applyEntryChange);
      changed = true;
    }
    if (pendingTopicsChanges.length){
      var topicsChanges = pendingTopicsChanges; pendingTopicsChanges = [];
      topicsChanges.forEach(applyTopicsChange);
      changed = true;
    }
    if (changed) render();
  }

  // Applies one audit_entries row-change payload to STATE.entries in place.
  // Falls back to a full refetch only if the payload doesn't look like the
  // shape Supabase Realtime is documented to send (defensive — shouldn't
  // normally happen).
  function applyEntryChange(payload){
    var kind = payload && (payload.eventType || payload.event);
    if (kind === "DELETE"){
      var oldId = payload.old && payload.old.id;
      if (oldId == null){ fullRefetchFallback(); return; }
      STATE.entries = STATE.entries.filter(function(e){ return e.id !== oldId; });
      return;
    }
    if (!payload || !payload.new || payload.new.id == null){ fullRefetchFallback(); return; }
    var row = payload.new;
    var entry = {
      id: row.id, date: row.date, shift: row.shift, type: row.type, auditor: row.auditor,
      fields: row.fields || {}, answers: row.answers || [], loggedAt: row.logged_at || row.date
    };
    normalizeEntries([entry]);
    var idx = -1;
    for (var i=0;i<STATE.entries.length;i++){ if (STATE.entries[i].id === entry.id){ idx = i; break; } }
    if (idx === -1) STATE.entries.push(entry); else STATE.entries[idx] = entry;
  }

  // Applies one checklist_topics row-change payload to STATE.topics in place.
  function applyTopicsChange(payload){
    if (!STATE.topics) STATE.topics = {};
    var kind = payload && (payload.eventType || payload.event);
    if (kind === "DELETE"){
      var oldType = payload.old && payload.old.type;
      if (oldType) delete STATE.topics[oldType];
      return;
    }
    if (!payload || !payload.new || !payload.new.type){ fullRefetchFallback(); return; }
    STATE.topics[payload.new.type] = payload.new.topics;
  }

  // Last-resort safety net for the rare payload shape the incremental path
  // can't handle — falls all the way back to the old "refetch everything"
  // behavior rather than risk STATE drifting out of sync with the database.
  var fullRefetchPending = false;
  function fullRefetchFallback(){
    if (fullRefetchPending) return;
    fullRefetchPending = true;
    fetchRemote().then(function(remote){
      fullRefetchPending = false;
      if (remote && Array.isArray(remote.entries)){ STATE = remote; render(); }
    });
  }

  // Photo thumbnails are deliberately small (so the checklist stays
  // compact), but they should still be viewable at full size on demand.
  // This is one delegated listener attached to the app container once —
  // not re-attached per render() — so it keeps working for both
  // in-progress draft photos and saved/read-only ones across every
  // re-render.
  document.getElementById("app").addEventListener("click", function(e){
    var img = e.target.closest(".photo-thumb img");
    if (!img) return;
    var src = img.getAttribute("src");
    if (src) window.open(src, "_blank");
  });

  loadViewFromStorage();
  init();

})();
</script>
</body>
